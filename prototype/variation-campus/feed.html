<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StudyBuddy — Feed</title>
<style>
  :root {
    --bg: #faf5ec;
    --surface: #fffdf9;
    --surface-alt: #fff8ec;
    --ink: #2b2620;
    --ink-soft: #766c5c;
    --ink-faint: #a89a84;
    --border: #ecdfc9;
    --border-soft: #f2e9d8;
    --accent: #c96f2e;
    --accent-ink: #a4551d;
    --accent-soft: #f7e3d0;
    --good: #4c7a4a;
    --good-soft: #e4f0e0;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-card: 0 1px 2px rgba(70,45,10,.05), 0 8px 20px -6px rgba(70,45,10,.10);
    --shadow-pop: 0 4px 10px -2px rgba(70,45,10,.10), 0 16px 32px -10px rgba(70,45,10,.16);
    --font-display: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
    --font-body: -apple-system, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #221c14; --surface: #2b2318; --surface-alt: #322920; --ink: #f4ecdd;
      --ink-soft: #c4b6a0; --ink-faint: #8d7f6a; --border: #423628; --border-soft: #3a2f23;
      --accent: #e08a48; --accent-ink: #f0a869; --accent-soft: #4a3423;
      --good: #7bab73; --good-soft: #2c3626;
      --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -6px rgba(0,0,0,.4);
      --shadow-pop: 0 4px 10px -2px rgba(0,0,0,.4), 0 16px 32px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #221c14; --surface: #2b2318; --surface-alt: #322920; --ink: #f4ecdd;
    --ink-soft: #c4b6a0; --ink-faint: #8d7f6a; --border: #423628; --border-soft: #3a2f23;
    --accent: #e08a48; --accent-ink: #f0a869; --accent-soft: #4a3423;
    --good: #7bab73; --good-soft: #2c3626;
  }
  :root[data-theme="light"] {
    --bg: #faf5ec; --surface: #fffdf9; --surface-alt: #fff8ec; --ink: #2b2620;
    --ink-soft: #766c5c; --ink-faint: #a89a84; --border: #ecdfc9; --border-soft: #f2e9d8;
    --accent: #c96f2e; --accent-ink: #a4551d; --accent-soft: #f7e3d0;
    --good: #4c7a4a; --good-soft: #e4f0e0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; }
  a { color: inherit; }

  .topnav { display: flex; align-items: center; gap: 22px; padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 8px; font: 700 17px/1 var(--font-display); letter-spacing: -0.01em; text-decoration: none; color: var(--ink); }
  .brand svg { color: var(--accent); }
  .topnav nav { display: flex; gap: 4px; margin-left: 8px; }
  .topnav nav a { text-decoration: none; color: var(--ink-soft); font-weight: 560; font-size: 14px; padding: 8px 14px; border-radius: 999px; transition: background .15s, color .15s; }
  .topnav nav a:hover { background: var(--surface-alt); color: var(--ink); }
  .topnav nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
  .who { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font: 650 13px/1 var(--font-display); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 30px 28px 60px; }
  .page-head { margin-bottom: 22px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .page-head h1 { font-size: 25px; letter-spacing: -0.015em; }
  .page-head .sub { color: var(--ink-soft); font-size: 14px; margin-top: 5px; }

  .add-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: #fff; border: none;
    padding: 9px 16px; border-radius: 999px;
    font: 600 13.5px/1 var(--font-body); cursor: pointer;
    box-shadow: var(--shadow-card);
  }
  .add-btn:hover { filter: brightness(1.06); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .fchip { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font: 600 12.5px/1 var(--font-mono); letter-spacing: .04em; color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .fchip .d { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h,0) 60% 52%); }
  .fchip.active { background: hsl(var(--h,0) 78% 93%); border-color: hsl(var(--h,0) 55% 78%); color: hsl(var(--h,0) 55% 26%); }
  .fchip.all.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

  .section-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 26px 0 12px; }
  .section-label:first-of-type { margin-top: 0; }

  .feed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .feed-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 4px solid hsl(var(--h) 55% 55%);
    border-radius: var(--radius-lg);
    padding: 17px 18px;
    box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; gap: 10px;
    text-decoration: none;
    color: var(--ink);
    transition: box-shadow .15s, transform .15s;
  }
  .feed-card:hover { box-shadow: var(--shadow-pop); transform: translateY(-2px); }
  .feed-card .tag {
    align-self: flex-start;
    font: 650 10.5px/1 var(--font-mono); letter-spacing: .05em;
    padding: 4px 9px; border-radius: 999px;
    background: hsl(var(--h) 78% 93%); color: hsl(var(--h) 55% 26%);
  }
  .feed-card .title { font-weight: 610; font-size: 14.5px; line-height: 1.4; }
  .feed-card .src { font-size: 12px; color: var(--ink-faint); word-break: break-all; }
  .feed-card .kind { margin-top: auto; font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 5px; }

  .shared-card { border-top-color: var(--accent); }
  .shared-card .by { font-size: 11.5px; color: var(--ink-faint); }

  .add-form-card {
    display: none;
    background: var(--surface-alt);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    margin-bottom: 22px;
  }
  .add-form-card.open { display: block; }
  .add-form-card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .add-form-card input, .add-form-card select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--ink); font: 400 13.5px/1.4 var(--font-body);
  }
  .add-form-card label { font-size: 11.5px; font-weight: 650; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; display: block; }
  .btn-primary { background: var(--accent); color: #fff; border: none; padding: 9px 16px; border-radius: 999px; font: 650 13px/1 var(--font-body); cursor: pointer; }

  @media (max-width: 980px) { .feed-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) {
    .feed-grid { grid-template-columns: 1fr; }
    .add-form-card .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="topnav">
  <a class="brand" href="dashboard.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3 2 8l10 5 10-5-10-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M6 11v5c0 1.2 2.7 3 6 3s6-1.8 6-3v-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    StudyBuddy
  </a>
  <nav aria-label="Primary">
    <a href="dashboard.html">Dashboard</a>
    <a href="course.html">Courses</a>
    <a href="study.html">Study</a>
    <a href="feed.html" aria-current="page">Feed</a>
  </nav>
  <div class="who"><span class="avatar">S</span></div>
</header>

<main class="wrap">

  <div class="page-head">
    <div>
      <h1>Feed</h1>
      <p class="sub">Curated resources for your courses, plus anything you've added.</p>
    </div>
    <button class="add-btn" id="toggle-add">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add resource
    </button>
  </div>

  <div class="add-form-card" id="add-form-card">
    <div class="row">
      <div>
        <label for="af-title">Title</label>
        <input type="text" id="af-title" placeholder="e.g. A cleaner derivation of Bernoulli" />
      </div>
      <div>
        <label for="af-course">Course</label>
        <select id="af-course"></select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="af-url">Link</label>
        <input type="text" id="af-url" placeholder="https://…" />
      </div>
      <div style="display:flex; align-items:flex-end;">
        <button class="btn-primary" id="af-submit" style="width:100%;">Add to feed</button>
      </div>
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="section-label">Curated for you</div>
  <div class="feed-grid" id="curated-grid"></div>

  <div class="section-label">Shared by you</div>
  <div class="feed-grid" id="shared-grid"></div>

</main>

<script>
(function () {
  const COURSES = [
    { code: 'CHEE 314', hue: 205 },
    { code: 'CHEE 370', hue: 150 },
    { code: 'MATH 264', hue: 265 },
    { code: 'CHEE 380', hue: 25 },
    { code: 'FACC 250', hue: 185 },
    { code: 'CHEE 310', hue: 340 },
    { code: 'CHEE 315', hue: 10 },
    { code: 'CHEE 351', hue: 45 },
    { code: 'CHEE 484', hue: 250 },
  ];
  const byCode = {}; COURSES.forEach(c => byCode[c.code] = c);

  // real canonical + feed links, trimmed from courses/courses.json
  const CURATED = [
    { course: 'CHEE 314', title: 'MIT OCW — Fluid Dynamics', url: 'https://ocw.mit.edu/search/?q=fluid%20dynamics', kind: 'Canonical' },
    { course: 'CHEE 314', title: 'LearnChemE interactive fluid mechanics simulations', url: 'https://learncheme.com/simulations/fluids/', kind: 'Feed' },
    { course: 'CHEE 314', title: "NASA Glenn — Beginner's Guide to Aerodynamics", url: 'https://www.grc.nasa.gov/www/k-12/airplane/', kind: 'Feed' },
    { course: 'CHEE 370', title: 'OpenStax Biology 2e', url: 'https://openstax.org/details/books/biology-2e', kind: 'Canonical' },
    { course: 'CHEE 370', title: 'Nobel Prize educational material on CRISPR/gene editing', url: 'https://www.nobelprize.org/prizes/chemistry/2020/press-release/', kind: 'Feed' },
    { course: 'CHEE 370', title: 'Addgene blog — molecular biology explainers', url: 'https://blog.addgene.org/', kind: 'Feed' },
    { course: 'MATH 264', title: '3Blue1Brown — Differential equations playlist', url: 'https://www.3blue1brown.com/topics/differential-equations', kind: 'Canonical' },
    { course: 'MATH 264', title: '3Blue1Brown — divergence and curl intuition', url: 'https://www.youtube.com/results?search_query=3blue1brown+divergence+curl', kind: 'Feed' },
    { course: 'MATH 264', title: "Paul's Online Math Notes — Calculus III", url: 'https://tutorial.math.lamar.edu/Classes/CalcIII/CalcIII.aspx', kind: 'Canonical' },
    { course: 'CHEE 380', title: 'DoITPoMS — materials science teaching resources', url: 'https://www.doitpoms.ac.uk/', kind: 'Canonical' },
    { course: 'CHEE 380', title: 'Materials Project — crystal/materials database', url: 'https://materialsproject.org/', kind: 'Feed' },
    { course: 'FACC 250', title: 'Engineers Canada — Guideline on the Code of Ethics', url: 'https://engineerscanada.ca/publications/guideline-on-the-code-of-ethics', kind: 'Canonical' },
    { course: 'FACC 250', title: 'The Challenger disaster as engineering ethics case', url: 'https://www.youtube.com/results?search_query=challenger+disaster+engineering+ethics', kind: 'Feed' },
    { course: 'CHEE 310', title: 'LibreTexts — Physical Chemistry', url: 'https://chem.libretexts.org/Bookshelves/Physical_and_Theoretical_Chemistry_Textbook_Maps', kind: 'Canonical' },
    { course: 'CHEE 310', title: 'Battery/electrochemistry explainers', url: 'https://www.youtube.com/results?search_query=electrochemistry+batteries+explained', kind: 'Feed' },
    { course: 'CHEE 315', title: 'MIT OCW — Heat Transfer', url: 'https://ocw.mit.edu/search/?q=heat%20transfer', kind: 'Canonical' },
    { course: 'CHEE 315', title: 'LearnChemE heat-transfer simulations', url: 'https://learncheme.com/simulations/heat-transfer/', kind: 'Feed' },
    { course: 'CHEE 351', title: 'LearnChemE distillation column simulations', url: 'https://learncheme.com/simulations/separations/', kind: 'Canonical' },
    { course: 'CHEE 351', title: 'How distillation columns work — visual explainers', url: 'https://www.youtube.com/results?search_query=distillation+column+how+it+works', kind: 'Feed' },
    { course: 'CHEE 484', title: 'MIT OCW — Materials Processing', url: 'https://ocw.mit.edu/search/?q=materials%20processing', kind: 'Canonical' },
    { course: 'CHEE 484', title: 'DoITPoMS teaching packages', url: 'https://www.doitpoms.ac.uk/', kind: 'Feed' },
  ];

  const SHARED_SEED = [
    { course: 'CHEE 314', title: 'My worked solution to Problem Set 3, Q4 (boundary layer approx.)', url: 'https://learncheme.com/simulations/fluids/', by: 'You · Aug 6' },
    { course: 'MATH 264', title: 'Summary sheet — Green, Gauss, Stokes at a glance', url: 'https://tutorial.math.lamar.edu/Classes/CalcIII/CalcIII.aspx', by: 'You · Aug 3' },
  ];

  let extraShared = [];
  try { extraShared = JSON.parse(localStorage.getItem('sb:shared')) || []; } catch (_) {}

  let activeFilter = 'all';

  const filtersEl = document.getElementById('filters');
  function renderFilters() {
    filtersEl.innerHTML = '';
    const all = document.createElement('div');
    all.className = 'fchip all' + (activeFilter === 'all' ? ' active' : '');
    all.textContent = 'All courses';
    all.addEventListener('click', () => { activeFilter = 'all'; render(); });
    filtersEl.appendChild(all);
    COURSES.forEach(c => {
      const el = document.createElement('div');
      el.className = 'fchip' + (activeFilter === c.code ? ' active' : '');
      el.style.setProperty('--h', c.hue);
      el.innerHTML = '<span class="d"></span>' + c.code;
      el.addEventListener('click', () => { activeFilter = c.code; render(); });
      filtersEl.appendChild(el);
    });
  }

  function cardHTML(item, isShared) {
    const co = byCode[item.course];
    let hostname = item.url;
    try { hostname = new URL(item.url).hostname.replace('www.', ''); } catch (_) {}
    return '<a class="feed-card' + (isShared ? ' shared-card' : '') + '" style="--h:' + co.hue + '" href="' + item.url + '" target="_blank" rel="noopener">' +
      '<span class="tag">' + item.course + '</span>' +
      '<span class="title">' + item.title + '</span>' +
      '<span class="src">' + hostname + '</span>' +
      (isShared
        ? '<span class="kind by">' + item.by + '</span>'
        : '<span class="kind">' + (item.kind === 'Canonical' ? '★ Canonical resource' : '◇ Curated feed pick') + '</span>') +
      '</a>';
  }

  function render() {
    renderFilters();
    const curatedGrid = document.getElementById('curated-grid');
    const sharedGrid = document.getElementById('shared-grid');
    const curatedItems = CURATED.filter(i => activeFilter === 'all' || i.course === activeFilter);
    const sharedItems = SHARED_SEED.concat(extraShared).filter(i => activeFilter === 'all' || i.course === activeFilter);
    curatedGrid.innerHTML = curatedItems.map(i => cardHTML(i, false)).join('') || '<p style="color:var(--ink-faint);font-size:13.5px;">No curated resources for this course yet.</p>';
    sharedGrid.innerHTML = sharedItems.map(i => cardHTML(i, true)).join('') || '<p style="color:var(--ink-faint);font-size:13.5px;">Nothing shared for this course yet.</p>';
  }

  const afCourse = document.getElementById('af-course');
  COURSES.forEach(c => {
    const o = document.createElement('option');
    o.value = c.code; o.textContent = c.code;
    afCourse.appendChild(o);
  });

  document.getElementById('toggle-add').addEventListener('click', () => {
    document.getElementById('add-form-card').classList.toggle('open');
  });

  document.getElementById('af-submit').addEventListener('click', () => {
    const title = document.getElementById('af-title').value.trim();
    const url = document.getElementById('af-url').value.trim();
    const course = afCourse.value;
    if (!title || !url) return;
    extraShared.unshift({ course, title, url, by: 'You · just now' });
    try { localStorage.setItem('sb:shared', JSON.stringify(extraShared)); } catch (_) {}
    document.getElementById('af-title').value = '';
    document.getElementById('af-url').value = '';
    document.getElementById('add-form-card').classList.remove('open');
    render();
  });

  render();
})();
</script>
</body>
</html>
